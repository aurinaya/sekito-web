  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0;
    background:var(--black);
    color:var(--white);
    height:100%;
    overflow-x:hidden;
  }

  body{
    font-family:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  /* ---------- textura de grano (ambiente, sutil) ---------- */
  #grain{
    position:fixed; inset:0;
    width:100vw; height:100vh;
    z-index:40;
    pointer-events:none;
    opacity:.05;
    mix-blend-mode:overlay;
    image-rendering:pixelated;
  }

  /* ---------- toggle de sonido ---------- */
  .sound-toggle{
    position:fixed;
    top:18px; right:18px;
    z-index:60;
    width:26px; height:26px;
    border:1px solid rgba(var(--gray-rgb),.35);
    border-radius:50%;
    background:none;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .sound-dot{
    width:6px; height:6px;
    border-radius:50%;
    background:var(--gray);
    transition:background .3s ease;
  }
  .sound-toggle.on .sound-dot{
    background:var(--white);
    animation:soundPulse 2.6s ease-in-out infinite;
  }
  @keyframes soundPulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(var(--white-rgb),.35); }
    50%{ box-shadow:0 0 0 6px rgba(var(--white-rgb),0); }
  }

  /* ---------- layout general ---------- */
  .stage{
    width:100%;
    max-width:380px;
    padding:32px 24px;
    position:relative;
    z-index:1;
  }

  .screen{ display:none; }
  .screen.active{ display:block; animation:screenIn .6s ease both; }
  @keyframes screenIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  /* las vistas de miembro se construyen más de a poco: cada bloque
     se anima por separado en vez de aparecer todo de una vez */
  .member-screen.active{ animation:none; }
  .member-screen .rv-a, .member-screen .rv-b, .member-screen .rv-c, .member-screen .rv-d{
    opacity:0;
    transform:translateY(8px);
  }
  .member-screen.active .rv-a{ animation: memberItemIn .5s ease forwards .05s; }
  .member-screen.active .rv-b{ animation: memberItemIn .5s ease forwards .32s; }
  .member-screen.active .rv-c{ animation: memberItemIn .5s ease forwards .60s; }
  .member-screen.active .rv-d{ animation: memberItemIn .5s ease forwards .88s; }
  @keyframes memberItemIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- gate (portal) ---------- */
  .fan-wrap{
    position:relative;
    width:126px;
    aspect-ratio:1400/910;
    margin:0 auto 88px;
  }
  .fan-layer{
    position:absolute; inset:0;
    mask-image:var(--fan-mask);
    -webkit-mask-image:var(--fan-mask);
    mask-size:contain; -webkit-mask-size:contain;
    mask-repeat:no-repeat; -webkit-mask-repeat:no-repeat;
    mask-position:center; -webkit-mask-position:center;
    opacity:0;
  }
  .fan-final{ background:var(--white); }
  .fan-bordo{ background:var(--bordo); }
  .fan-amarillo{ background:var(--amarillo); }

  .fan-breathe{ position:absolute; inset:0; }

  /* entrada: golpe violento y muy rápido entre bordo y amarillo, después asienta en f2f2f2 */
  .fan-wrap.play .fan-bordo{ animation: glitchBordo .38s steps(1) forwards; }
  .fan-wrap.play .fan-amarillo{ animation: glitchAmarillo .4s steps(1) forwards; }
  .fan-wrap.play .fan-final{ animation: fanFinalIn .14s ease .38s forwards; }

  /* asentado: sin color — el blanco respira suave (en el wrapper) y
     además tiene un quiebre mínimo y constante (en la capa misma),
     nunca se detiene del todo, nunca se nota fuerte */
  .fan-wrap.settled .fan-breathe{ animation: breathe 5s ease-in-out infinite alternate; }
  .fan-wrap.settled .fan-final{ animation: microGlitch 1.3s steps(1) infinite; }

  /* error: sin color — el mismo quiebre pero más brusco por un instante */
  .fan-wrap.error .fan-final{ animation: errorGlitchMono .22s steps(1) 1 !important; }

  @keyframes glitchBordo{
    0%{ opacity:0; transform:translate(0,0); }
    12%{ opacity:1; transform:translate(-8px,5px); }
    26%{ opacity:.15; transform:translate(7px,-4px); }
    40%{ opacity:1; transform:translate(-6px,0); }
    55%{ opacity:.1; transform:translate(5px,5px); }
    70%{ opacity:1; transform:translate(-4px,-3px); }
    85%{ opacity:.3; transform:translate(3px,2px); }
    100%{ opacity:0; transform:translate(0,0); }
  }
  @keyframes glitchAmarillo{
    0%{ opacity:0; transform:translate(0,0); }
    15%{ opacity:.8; transform:translate(6px,-5px); }
    30%{ opacity:.15; transform:translate(-5px,3px); }
    46%{ opacity:1; transform:translate(4px,6px); }
    62%{ opacity:.2; transform:translate(-6px,-2px); }
    78%{ opacity:1; transform:translate(3px,-3px); }
    92%{ opacity:.25; transform:translate(-2px,2px); }
    100%{ opacity:0; transform:translate(0,0); }
  }
  @keyframes fanFinalIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes breathe{ from{ transform:scale(1);} to{ transform:scale(1.015); } }

  /* quiebre mínimo y constante: casi nada, todo el tiempo — sin color,
     solo un temblor de menos de un píxel cada tanto dentro del ciclo */
  @keyframes microGlitch{
    0%{ opacity:1; transform:translate(0,0); }
    18%{ opacity:1; transform:translate(0,0); }
    19%{ opacity:1; transform:translate(.8px,0); }
    20%{ opacity:1; transform:translate(0,-.6px); }
    21%{ opacity:1; transform:translate(0,0); }
    55%{ opacity:1; transform:translate(0,0); }
    56%{ opacity:1; transform:translate(-.7px,.5px); }
    57%{ opacity:1; transform:translate(0,0); }
    100%{ opacity:1; transform:translate(0,0); }
  }

  /* error: el mismo quiebre pero más grande y con un invert breve — sigue sin color */
  @keyframes errorGlitchMono{
    0%{ opacity:1; transform:translate(0,0); filter:none; }
    20%{ opacity:.4; transform:translate(-4px,3px); filter:invert(1); }
    45%{ opacity:1; transform:translate(3px,-2px); filter:none; }
    70%{ opacity:.5; transform:translate(-2px,2px); filter:invert(1); }
    100%{ opacity:1; transform:translate(0,0); filter:none; }
  }

  .prompt-block{
    opacity:0;
    transform:translateY(4px);
    text-align:center;
  }
  .prompt-block.show{
    opacity:1;
    transform:translateY(0);
    transition:opacity .7s ease, transform .7s ease;
  }

  .code-row{
    display:inline-flex;
    align-items:center;
    gap:10px;
  }
  .code-row.deny{ animation: shake .4s linear; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-5px); }
    40%{ transform:translateX(4px); }
    60%{ transform:translateX(-3px); }
    80%{ transform:translateX(2px); }
  }
  .code-row.flash{ animation: flash .09s steps(1) 3; }
  @keyframes flash{ 50%{ filter:invert(1); } }

  .chevron{ color:var(--gray); font-size:15px; transition:color .2s ease; }
  .code-row:focus-within .chevron{ color:var(--white); }

  #code-input{
    width:170px;
    background:transparent;
    border:none;
    outline:none;
    color:var(--white);
    font-family:inherit;
    font-size:16px;
    letter-spacing:.14em;
    text-align:center;
    text-transform:uppercase;
    caret-color:var(--white);
  }
  #code-input::placeholder{ color:rgba(var(--gray-rgb),.5); letter-spacing:.14em; }

  /* ---------- member view (genérica) ---------- */
  .top-row{
    display:flex; justify-content:flex-end;
    margin-bottom:22px;
  }
  .exit-link{
    font-size:10px; letter-spacing:.1em; color:var(--gray);
    background:none; border:none; font-family:inherit; cursor:pointer;
  }
  .exit-link:hover{ color:var(--white); }

  .hero-logo{
    display:block;
    width:74%;
    max-width:250px;
    margin:0 auto 26px;
    height:auto;
  }
  .hero-logo path{ fill:var(--white); }

  .identity-line{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:9px;
    margin-bottom:32px;
  }
  .identity-line .chevron{ color:var(--gray); font-size:14px; }
  .identity-line .identity-code{
    font-size:14px; letter-spacing:.2em; color:var(--white);
  }

  /* ---------- semilla / linaje ---------- */
  .lineage{
    display:flex;
    align-items:center;
    gap:12px;
    border-top:1px solid rgba(var(--gray-rgb),.25);
    padding-top:16px;
    margin-top:4px;
  }
  .seed-glyph{ width:26px; height:26px; color:var(--gray); flex-shrink:0; }
  .lineage-text{ display:flex; flex-direction:column; gap:3px; }
  .lineage-level{ font-size:10px; letter-spacing:.18em; color:var(--white); }
  .lineage-note{ font-size:9px; letter-spacing:.04em; color:var(--gray); }

  .section-title{
    font-size:10px; letter-spacing:.16em; color:var(--gray);
    margin-bottom:12px;
  }

  .qr-block{
    display:flex; flex-direction:column; align-items:center;
    border:1px solid rgba(var(--gray-rgb),.3);
    padding:20px; margin-bottom:30px;
  }
  .qr-block img{
    width:150px; height:150px;
    background:var(--black);
    margin-bottom:12px;
  }
  .qr-caption{ font-size:10px; letter-spacing:.1em; color:var(--gray); }

  .photo-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:30px;
  }
  .photo-cell{
    aspect-ratio:1;
    background:
      repeating-linear-gradient(135deg,
        rgba(var(--gray-rgb),.14) 0 2px,
        transparent 2px 8px);
    border:1px solid rgba(var(--gray-rgb),.25);
    display:flex; align-items:flex-end;
    padding:5px;
  }
  .photo-cell span{ font-size:8px; color:var(--gray); letter-spacing:.03em; }

  .member-footer{
    border-top:1px solid rgba(var(--gray-rgb),.25);
    padding-top:14px;
    display:flex; justify-content:space-between;
    font-size:10px; color:rgba(var(--gray-rgb),.7); letter-spacing:.05em;
  }

  /* ---------- member view MAU (personalizada) ---------- */
  .mau-heading{
    text-align:center;
    font-size:34px;
    font-weight:600;
    letter-spacing:.3em;
    margin:0 0 6px;
  }
  .mau-sub{
    text-align:center;
    font-size:10px;
    letter-spacing:.15em;
    color:var(--gray);
    margin-bottom:10px;
  }
  .mau-logo{
    display:block;
    width:52%;
    max-width:170px;
    margin:0 auto 34px;
    height:auto;
  }
  .mau-logo path{ fill:var(--white); }

  .building{
    text-align:center;
    border-top:1px solid rgba(var(--gray-rgb),.25);
    padding-top:18px;
    margin-top:4px;
  }
  .building-dots{
    display:flex; justify-content:center; gap:6px; margin-bottom:10px;
  }
  .building-dots span{
    width:4px; height:4px; border-radius:50%;
    background:var(--gray);
    display:inline-block;
    animation: buildPulse 1.6s ease-in-out infinite;
  }
  .building-dots span:nth-child(2){ animation-delay:.2s; }
  .building-dots span:nth-child(3){ animation-delay:.4s; }
  @keyframes buildPulse{
    0%,100%{ opacity:.25; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.4); }
  }
  .building-text{
    font-size:9px; letter-spacing:.12em; color:var(--gray);
  }

  .carousel-wrap{
    width:100%;
    aspect-ratio:2/3;
    overflow:hidden;
    border:1px solid rgba(var(--gray-rgb),.3);
    margin-bottom:14px;
  }
  .carousel-track{
    display:flex;
    width:100%; height:100%;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .carousel-track::-webkit-scrollbar{ display:none; }
  .carousel-slide{
    flex:0 0 100%;
    scroll-snap-align:center;
    height:100%;
  }
  .carousel-slide img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .carousel-dots{
    display:flex; justify-content:center; gap:6px;
    margin-bottom:30px;
  }
  .dot{
    width:5px; height:5px; border-radius:50%;
    background:rgba(var(--gray-rgb),.4);
    transition:background .25s ease, transform .25s ease;
    cursor:pointer;
  }
  .dot.active{ background:var(--white); transform:scale(1.3); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }
</style>
</head>

<script>
/* =====================================================================
   PROTOTIPO — validación 100% en el cliente, solo para probar la UX.
   Códigos de prueba (no distingue mayúsculas): AURINAYA · MAU · NAYA
   MAU tiene contenido personalizado (carrusel de fotos). Los otros dos
   caen en la vista genérica con QR + registro placeholder.

   Para producción esto se reemplaza por una llamada real:
   const res = await fetch('/api/validar-codigo', { method:'POST', body: JSON.stringify({codigo}) });
   y el backend (Supabase, por ejemplo) responde si es válido + el
   contenido de ESE miembro puntual, sin exponer el resto de la base.
   ===================================================================== */

const VALID_CODES = new Set(['AURINAYA', 'MAU', 'NAYA']);

const fanWrap = document.getElementById('fanWrap');
const promptBlock = document.getElementById('promptBlock');
const codeForm = document.getElementById('codeForm');
const codeRow = document.getElementById('codeRow');
const codeInput = document.getElementById('code-input');
const gateScreen = document.getElementById('gate');
const memberScreen = document.getElementById('member');
const memberMauScreen = document.getElementById('member-mau');
const exitBtn = document.getElementById('exitBtn');
const exitBtnMau = document.getElementById('exitBtnMau');
const chipCode = document.getElementById('chipCode');
const qrImg = document.getElementById('qrImg');
const levelText = document.getElementById('levelText');
const plainFooter = document.getElementById('plainFooter');
const lineageBadge = document.getElementById('lineageBadge');

// fundadores del sékito: semilla cero. el resto queda en nivel 01
// hasta que armemos el sistema de linaje real (quién invitó a quién)
const FOUNDERS = new Set(['MAU', 'NAYA']);

const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function reveal(){
  if (reduced){
    fanWrap.classList.add('play','settled');
    promptBlock.classList.add('show');
    codeInput.focus();
    return;
  }

  const fanFinal = fanWrap.querySelector('.fan-final');
  fanWrap.classList.add('play');
  fanFinal.addEventListener('animationend', () => {
    fanWrap.classList.add('settled');
    promptBlock.classList.add('show');
    codeInput.focus();
  }, { once: true });
}

codeForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const raw = codeInput.value.trim().toUpperCase();
  if (!raw) return;

  if (VALID_CODES.has(raw)){
    grant(raw);
  } else {
    deny();
  }
});

function deny(){
  codeRow.classList.remove('deny','flash');
  void codeRow.offsetWidth; // reiniciar animación
  codeRow.classList.add('deny','flash');

  // el abanico también se rompe un instante
  fanWrap.classList.remove('error');
  void fanWrap.offsetWidth; // reiniciar animación
  fanWrap.classList.add('error');
  setTimeout(() => fanWrap.classList.remove('error'), 260);

  // scramble breve del input, después limpia — sin texto de error
  const chars = '#%&/¬·░▒▓×';
  let n = 0;
  const original = codeInput.value;
  const scrambleInt = setInterval(() => {
    codeInput.value = Array.from({length: original.length}, () =>
      chars[Math.floor(Math.random()*chars.length)]).join('');
    n++;
    if (n > 4){
      clearInterval(scrambleInt);
      codeInput.value = '';
      codeInput.focus();
    }
  }, 45);
}

function grant(code){
  gateScreen.classList.remove('active');

  if (code === 'MAU'){
    memberMauScreen.classList.add('active');
  } else {
    chipCode.textContent = code;
    qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=260x260&bgcolor=0D0D0D&color=F2F2F2&data=${encodeURIComponent('sekito.com/acceso/' + code)}`;

    if (FOUNDERS.has(code)){
      plainFooter.hidden = true;
      lineageBadge.hidden = false;
    } else {
      plainFooter.hidden = false;
      lineageBadge.hidden = true;
      levelText.textContent = 'sékito · nivel 01';
    }

    memberScreen.classList.add('active');
  }
}

function resetToGate(){
  memberScreen.classList.remove('active');
  memberMauScreen.classList.remove('active');
  gateScreen.classList.add('active');
  codeInput.value = '';
  codeInput.focus();
}
exitBtn.addEventListener('click', resetToGate);
exitBtnMau.addEventListener('click', resetToGate);

reveal();

/* ---------- carrusel de fotos (MAU) ---------- */
(function carousel(){
  const track = document.getElementById('carouselTrack');
  if (!track) return;
  const dots = document.querySelectorAll('#carouselDots .dot');

  dots.forEach(d => d.addEventListener('click', () => {
    const i = +d.dataset.i;
    track.scrollTo({ left: track.clientWidth * i, behavior:'smooth' });
  }));

  track.addEventListener('scroll', () => {
    const i = Math.round(track.scrollLeft / track.clientWidth);
    dots.forEach((d, idx) => d.classList.toggle('active', idx === i));
  }, { passive:true });
})();

/* ---------- sonido binaural, 7Hz, opt-in ---------- */
(function sound(){
  const btn = document.getElementById('soundToggle');
  let audioCtx, gainNode, oscL, oscR, on = false;

  function init(){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const carrier = 200;  // tono base grave
    const beat = 7;       // diferencia entre oídos = late percibido en 7Hz (rango theta)

    oscL = audioCtx.createOscillator();
    oscR = audioCtx.createOscillator();
    oscL.type = 'sine';
    oscR.type = 'sine';
    oscL.frequency.value = carrier;
    oscR.frequency.value = carrier + beat;

    const panL = audioCtx.createStereoPanner(); panL.pan.value = -1;
    const panR = audioCtx.createStereoPanner(); panR.pan.value = 1;

    gainNode = audioCtx.createGain();
    gainNode.gain.value = 0;

    oscL.connect(panL).connect(gainNode);
    oscR.connect(panR).connect(gainNode);
    gainNode.connect(audioCtx.destination);

    oscL.start();
    oscR.start();
  }

  btn.addEventListener('click', () => {
    if (!audioCtx) init();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    on = !on;
    const now = audioCtx.currentTime;
    gainNode.gain.cancelScheduledValues(now);
    gainNode.gain.setValueAtTime(gainNode.gain.value, now);
    gainNode.gain.linearRampToValueAtTime(on ? 0.035 : 0, now + 1.4);

    btn.classList.toggle('on', on);
    btn.setAttribute('aria-pressed', String(on));
  });
})();

/* ---------- grano de fondo (textura, sutil) ---------- */
(function grain(){
  const canvas = document.getElementById('grain');
  const ctx = canvas.getContext('2d');
  const SIZE = 90;
  canvas.width = SIZE;
  canvas.height = SIZE;
  canvas.style.imageRendering = 'pixelated';

  function draw(){
    const imgData = ctx.createImageData(SIZE, SIZE);
    const buf = new Uint32Array(imgData.data.buffer);
    for (let i = 0; i < buf.length; i++){
      buf[i] = Math.random() < 0.5 ? 0xffffffff : 0x00000000;
    }
    ctx.putImageData(imgData, 0, 0);
  }
  draw();
  if (!reduced){
    setInterval(draw, 130);
  }
})();
</script>
