<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500&display=swap" rel="stylesheet">
<style>
  /* Cleopatra, la letra oficial de la Seki: solo para el S7 (08/10) */
  @font-face{ font-family:'Cleopatra'; src:url('/fuentes/cleopatra.otf') format('opentype'); font-display:block; }
  :root{
    --black:#0D0D0D;
    --white-rgb:242,242,242;
    --gray-rgb:242,242,242;              /* sobre bordo, el gris azulado embarra */
    --white:rgb(var(--white-rgb));
    --gray:rgba(var(--gray-rgb),.68);    /* el segundo plano es blanco bajado */
    --bordo:#800020;
    --fan-mask:url("../images/abanico-seki.svg");
  }
  *{ box-sizing:border-box; }
  /* el corte ya no lo da el abanico (que queda blanco): lo da el fondo,
     que se inunda de bordo de golpe. */
  html{ background:var(--black); transition:background-color .7s ease-out; }
  html.inundado{ background:var(--bordo); }
  html,body{ margin:0; padding:0; height:100%; }
  body{ background:transparent; }
  body{
    font-family:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    color:var(--white);
    min-height:100svh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:calc(env(safe-area-inset-top,0px) + 32px) 22px
            calc(env(safe-area-inset-bottom,0px) + 32px);
    text-align:center;
    overflow:hidden;
  }

  /* el grano del portal, para que se sienta la misma casa */
  #grano{
    position:fixed; inset:0; z-index:3;
    width:100vw; height:100vh;
    opacity:.045;
    mix-blend-mode:overlay;
    pointer-events:none;
    image-rendering:pixelated;
  }

  /* La tela: el viñeteado, los bordes apagados de una foto vieja.
     Aparece recién con la inundación: antes no hay nada que texturar. */
  #tela{
    position:fixed; inset:0; z-index:2;
    pointer-events:none;
    opacity:0; transition:opacity 1.6s ease;
    background:
      radial-gradient(125% 100% at 50% 44%, transparent 40%, rgba(0,0,0,.30) 100%);
  }

  /* La chispa: cada tanto la cinta salta. Dos parpadeos pegados y, más
     tarde, uno solo. Once segundos de vuelta entera, así nunca cae en un
     ritmo que se pueda anticipar. */
  #chispa{
    position:fixed; inset:0; z-index:4;
    pointer-events:none;
    background:rgba(var(--white-rgb),.055);
    opacity:0;
  }
  html.inundado #tela{ opacity:1; }
  html.inundado #chispa{ animation:cinta 11s linear infinite; }
  @keyframes cinta{
    0%,   49.3%{ opacity:0; }
    49.6%      { opacity:.55; }
    49.9%      { opacity:0; }
    50.2%      { opacity:.85; }
    50.7%, 86.6%{ opacity:0; }
    86.9%      { opacity:.45; }
    87.3%, 100%{ opacity:0; }
  }

  .abanico{
    width:130px; height:84px;
    background:var(--white);
    -webkit-mask:var(--fan-mask) center / contain no-repeat;
            mask:var(--fan-mask) center / contain no-repeat;
  }

  /* ---------- el S7: blanco que brilla ----------
     El tamaño y el lugar de siempre. Aparece de una (no se escribe), y queda
     con un halo blanco que respira despacio. */
  .nombre{
    font-size:clamp(42px, 16vw, 72px);
    font-weight:400;
    margin:70px 0 0;
    line-height:1.2;
    min-height:1.2em;
    opacity:0;
  }
  /* el tracking va solo entre letras: el espacio de más que deja después de
     la última se compensa a la izquierda, y el S7 queda centrado de verdad.
     Desde el 08/10 el S7 va en Cleopatra, la letra de la Seki, engrosada
     con un contorno de su mismo color (Cleopatra tiene un solo grosor) y con
     más brillo; igual en el perfil, las placas, las historias y el reel */
  .nombre .piedra{
    display:inline-block;
    font-family:'Cleopatra', serif;
    letter-spacing:.02em;
    padding-left:.02em;
    -webkit-text-stroke:.0122em currentColor;
    position:relative; left:0;     /* lo ajusta la medida de la tinta */
    color:var(--white);
    filter:drop-shadow(0 0 10px rgba(255,255,255,.48));
  }
  .nombre.cayo{ opacity:1; animation:asoma .5s ease-out both; }
  @keyframes asoma{
    0%  { opacity:0; transform:scale(1.04); filter:blur(3px); }
    100%{ opacity:1; transform:scale(1);    filter:blur(0); }
  }
  .nombre.cayo .piedra{
    animation:respira 4.2s ease-in-out .5s infinite;
  }
  @keyframes respira{
    0%,100%{ filter:drop-shadow(0 0 9px rgba(255,255,255,.42)); }
    50%    { filter:drop-shadow(0 0 23px rgba(255,255,255,.88)); }
  }
  .fecha{
    font-size:12px;
    letter-spacing:.3em;
    color:var(--gray);
    margin-top:40px;
    text-indent:.3em;
    min-height:1.5em;
  }
  .lugar{
    font-size:11px;
    letter-spacing:.22em;
    color:rgba(var(--gray-rgb),.44);
    margin-top:20px;
    text-indent:.22em;
    min-height:1.5em;
  }
  /* la fecha y el lugar no se escriben: aparecen. Lo que se teclea es una
     sola cosa, que por eso se nota. */
  .aparece{ opacity:0; transition:opacity .9s ease; }
  .aparece.llego{ opacity:1; }

  /* la preventa respira, igual que el botón de invitar del portal.
     Pero en bordo: acá el que llama es SEKI. */
  .preventa{
    display:inline-block;
    margin-top:72px;
    text-decoration:none;
    padding:13px 26px;
    border:1px solid rgba(var(--white-rgb),.55);
    background:rgba(var(--white-rgb),.07);
    color:var(--white);
    font-size:10.5px;
    letter-spacing:.16em;
    text-transform:uppercase;
    opacity:0;
    transition:opacity .9s ease;
  }
  .preventa.llego{
    opacity:1;
    animation:respiraBlanco 4.5s ease-in-out infinite;
  }
  @keyframes respiraBlanco{
    0%,100%{ box-shadow:0 0 10px 0 rgba(var(--white-rgb),.18), inset 0 0 14px rgba(var(--white-rgb),.07); }
    50%    { box-shadow:0 0 28px 3px rgba(var(--white-rgb),.42), inset 0 0 22px rgba(var(--white-rgb),.16); }
  }

  /* la rendija */
  .rendija{
    position:fixed;
    left:0; right:0;
    bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
    text-align:center;
  }
  /* Sigue siendo una rendija: chiquita y abajo, lejos del botón de la
     preventa, que es lo que importa. Pero ya no se esconde: brilla, y el
     brillo respira despacio. Luz que se escapa por debajo de una puerta. */
  .rendija button{
    background:none; border:none;
    font-family:inherit; font-size:10px;
    letter-spacing:.18em;
    color:rgba(var(--white-rgb),.72);
    text-decoration:underline; text-underline-offset:5px;
    text-decoration-color:rgba(var(--white-rgb),.3);
    cursor:pointer; padding:10px;
    animation:seEscapa 5s ease-in-out infinite;
  }
  .rendija button:hover{ color:var(--white); text-decoration-color:var(--white); }
  @keyframes seEscapa{
    0%,100%{ text-shadow:0 0 4px rgba(var(--white-rgb),.15); }
    50%    { text-shadow:0 0 12px rgba(var(--white-rgb),.75), 0 0 3px rgba(var(--white-rgb),.5); }
  }
  @media (prefers-reduced-motion: reduce){ .rendija button{ animation:none; } }
  .rogar{
    font-size:11px; line-height:1.9; color:var(--gray);
    margin-top:12px;
  }
  .rogar .frase{ color:var(--white); font-style:italic; cursor:pointer; }
  .rogar a{
    display:inline-block; margin-top:12px;
    border:1px solid rgba(var(--gray-rgb),.5);
    color:var(--white); text-decoration:none;
    font-size:10px; letter-spacing:.16em; text-transform:uppercase;
    padding:9px 18px;
  }
  .rogar a:hover{ border-color:var(--white); }
  .copiado{
    font-size:9px; letter-spacing:.1em; color:#D9A11E;
    min-height:12px; margin-top:10px;
    opacity:0; transition:opacity .3s ease;
  }
  .copiado.show{ opacity:1; }
  [hidden]{ display:none !important; }

  @media (prefers-reduced-motion: reduce){
    .nombre{ opacity:1; }
    .nombre.cayo, .nombre.cayo .piedra{ animation:none; }
    .preventa, .aparece{ transition:none; }
    #tela{ transition:none; }
    html.inundado #chispa{ animation:none; }
    .preventa.llego{ animation:none; box-shadow:0 0 26px rgba(var(--white-rgb),.3); }
  }
</style>
</head>
<body>

<canvas id="grano" aria-hidden="true"></canvas>
<div id="tela" aria-hidden="true"></div>
<div id="chispa" aria-hidden="true"></div>

<div class="abanico" id="abanico" role="img" aria-label="S7"></div>

<h1 class="nombre" id="nombre"><span class="piedra">S7</span></h1>
<div class="fecha aparece" id="fecha">SÁBADO 14 · NOVIEMBRE</div>
<div class="lugar aparece" id="lugar">PALERMO, BUENOS AIRES</div>
<a class="preventa" id="preventa" href="https://www.sekito.ar/?ir=preventa">tanda sekreta desde el portal</a>

<div class="rendija">
  <button type="button" id="sinCodigo">no tengo mi llave</button>
  <div class="rogar" id="rogar" hidden>
    <div>Se le pide a la sekta, por privado.</div>
    <div class="frase" id="frase">quiero mi llave para el portal</div>
    <a id="irIg" href="https://ig.me/m/sekito.gde" target="_blank" rel="noopener">ir a instagram</a>
    <div class="copiado" id="copiado"></div>
  </div>
</div>

<script>
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- la falla ----------
   Milisegundo y medio de abanico blanco que parpadea, el parpadeo se acelera,
   y corta de golpe al bordo. El bordo es SEKI: el color dice el nombre antes
   que el texto.

   Termina quieto en la información a propósito. El que llega tarde, recarga,
   o vuelve, tiene que ver la fecha igual — un teaser que nadie ve terminar
   es un teaser perdido. */
(function falla(){
  const fan    = document.getElementById('abanico');
  const BLANCO = 'var(--white)';
  const inundar = () => document.documentElement.classList.add('inundado');


  function mostrarResto(){
    document.getElementById('fecha').classList.add('llego');
    document.getElementById('lugar').classList.add('llego');
    setTimeout(() => document.getElementById('preventa').classList.add('llego'), 650);
  }

  // el S7 no se escribe: aparece, un momento después de la inundación
  function aparecer(){
    document.getElementById('nombre').classList.add('cayo');
    setTimeout(mostrarResto, 900);
  }

  function terminar(){
    inundar();
    fan.style.background = BLANCO;
    setTimeout(aparecer, 450);
  }

  if (reduced){
    inundar();
    fan.style.background = BLANCO;
    document.getElementById('nombre').classList.add('cayo');
    mostrarResto();
    return;
  }

  const rand = (a, b) => a + Math.random() * (b - a);
  const pasos = [];

  // primer tramo: apenas se nota que algo anda mal
  let t = 0;
  while (t < 680){
    const on = rand(80, 165), off = rand(10, 20);
    pasos.push([BLANCO, on], ['transparent', off]);
    t += on + off;
  }
  // segundo tramo: se desarma
  while (t < 1120){
    const on = rand(18, 48), off = rand(22, 46);
    pasos.push([BLANCO, on], ['transparent', off]);
    t += on + off;
  }
  // el corte
  pasos.push(['transparent', 90]);

  let i = 0;
  (function tick(){
    if (i >= pasos.length){ terminar(); return; }
    const [color, dur] = pasos[i++];
    fan.style.background = color;
    setTimeout(tick, dur);
  })();
})();

/* ---------- el grano ---------- */
(function grano(){
  const c = document.getElementById('grano');
  const x = c.getContext('2d');
  const N = 200;
  c.width = N; c.height = N;
  c.style.imageRendering = 'pixelated';
  function dibujar(){
    const d = x.createImageData(N, N);
    const b = new Uint32Array(d.data.buffer);
    for (let i = 0; i < b.length; i++) b[i] = Math.random() < .5 ? 0xffffffff : 0;
    x.putImageData(d, 0, 0);
  }
  dibujar();
  if (!reduced) setInterval(dibujar, 130);
})();

/* ---------- la rendija ----------
   Instagram no deja precargar el texto de un privado, así que la frase se
   copia al portapapeles y se pega. */
(function rendija(){
  const boton = document.getElementById('sinCodigo');
  const caja  = document.getElementById('rogar');
  const frase = document.getElementById('frase');
  const ir    = document.getElementById('irIg');
  const dicho = document.getElementById('copiado');

  function copiar(){
    navigator.clipboard.writeText(frase.textContent.trim()).then(() => {
      dicho.textContent = 'frase copiada';
      dicho.classList.add('show');
      setTimeout(() => dicho.classList.remove('show'), 2400);
    }).catch(() => {});
  }

  boton.addEventListener('click', () => {
    caja.hidden = false;
    boton.hidden = true;
    copiar();
  });
  frase.addEventListener('click', copiar);
  ir.addEventListener('click', copiar);
})();
</script>
</body>
